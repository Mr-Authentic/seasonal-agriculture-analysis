# .github/workflows/generate_plots.yml
name: Generate and Push Plots Automatically

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-and-plot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib pandas seaborn scipy  # ← added seaborn & scipy

      - name: Run plot script
        run: python main.py  # ← your actual filename

      - name: Commit and Push Plots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/plots/*.png  # ← matches where your code actually saves
          git diff-index --quiet HEAD || git commit -m "Automated plot update [skip ci]"
          git push
